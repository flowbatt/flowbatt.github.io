name: Deploy FlowBatt to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the website
        uses: actions/checkout@v7
      - name: Build Astro and upload the Pages artifact
        uses: withastro/action@v6
        with:
          node-version: 24
          package-manager: npm
        env:
          FLOWBATT_SITE_URL: https://flowbatt.github.io
          FLOWBATT_BASE_PATH: /

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the website
        id: deployment
        uses: actions/deploy-pages@v5
